<!doctype html>
<html lang="pt-BR">
<head><meta charset="utf-8"><title>Missão da turma</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600\&family=Lexend:wght@400;600\&display=swap">
<style>
body{margin:0;background:var(--surface);color:var(--ink);font-family:var(--font-sans);}
.wrap{padding:var(--space-5);max-width:390px;}
.c{background:var(--surface-raised);border-radius:var(--radius-lg);box-shadow:var(--shadow-aluno);padding:var(--space-4);display:flex;flex-direction:column;gap:var(--space-3);}
.k{font-size:13px;line-height:18px;font-weight:600;color:var(--laranja-texto);letter-spacing:.04em;text-transform:uppercase;}
h3{margin:0;font-family:var(--font-display);font-size:22px;line-height:28px;font-weight:600;}
.bar{height:16px;border-radius:var(--radius-full);background:var(--violeta-soft);overflow:hidden;}
.bar i{display:block;height:100%;width:68%;background:var(--laranja);border-radius:var(--radius-full);}
.row{display:flex;justify-content:space-between;font-size:14px;line-height:20px;color:var(--ink-muted);}
.row b{color:var(--ink);font-weight:600;}
</style></head>
<body><div class="wrap"><div class="c">
<span class="k">Missão do 7º A</span>
<h3>500 exercícios de frações até sexta</h3>
<div class="bar" role="progressbar" aria-valuenow="68" aria-valuemin="0" aria-valuemax="100"><i></i></div>
<div class="row"><span><b>68%</b> da turma</span><span>faltam 3 dias</span></div>
</div></div></body></html>
