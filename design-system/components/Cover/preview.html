<!-- @dsCard height=288 -->
<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Eduka</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600&family=Lexend:wght@400&display=swap">
<style>
  html, body { margin:0; height:100%; }
  body { background:var(--surface); color:var(--ink); font-family:var(--font-sans); overflow:hidden; }
  .cover { position:relative; height:288px; overflow:hidden; }
  .art { position:absolute; top:0; left:480px; width:480px; height:288px; overflow:hidden; }
  .art svg { display:block; width:480px; height:288px; }
  .brand { fill:var(--violeta); }
  .tint { fill:var(--violeta-soft); }
  .deep { fill:var(--ink); }
  .peca { fill:var(--laranja); }
  .ok { fill:var(--acerto); }
  .gap { fill:var(--surface); }
  .words { position:absolute; left:var(--space-8); bottom:var(--space-8); max-width:440px; }
  .name { margin:0; font-family:var(--font-display); font-size:112px; line-height:.9; font-weight:600; letter-spacing:-.01em; color:var(--ink); }
  .tag { margin:var(--space-2) 0 0 4px; font-size:14px; line-height:20px; color:var(--ink-muted); }
</style>
</head>
<body>
<div class="cover">
<div class="art" aria-hidden="true">
<svg viewBox="0 0 480 288" width="480" height="288">
<!--
  blocks      violeta 208x232 sangrando pelo topo (a marca, maior) · violeta-soft 136x136 (alívio) · ink 120x248 sangrando pela direita · acerto 56x16 uma vez (só estado) ≈ 35% da capa
  arrangement um bloco alto com satélites, bases alinhadas a space-6 da borda inferior, calhas space-4
  pattern     motivo literal do logo: pares de pílulas em K (uma reta e uma inclinada 38°, como as orelhas do Kadu) em surface e violeta, e a peça laranja como disco ao lado; três pares
  scales      lados múltiplos de space-2; calhas space-4; cantos radius-lg (20) e radius-xl (28); pílulas e discos com raio = metade da largura
-->
<rect class="brand" x="24" y="-24" width="208" height="288" rx="28"/>
<rect class="gap" x="84" y="64" width="32" height="120" rx="16"/>
<rect class="gap" x="112" y="72" width="32" height="112" rx="16" transform="rotate(38 128 184)"/>
<circle class="peca" cx="196" cy="52" r="16"/>
<rect class="tint" x="248" y="128" width="136" height="136" rx="20"/>
<rect class="brand" x="288" y="148" width="20" height="72" rx="10"/>
<rect class="brand" x="306" y="152" width="20" height="68" rx="10" transform="rotate(38 316 220)"/>
<circle class="peca" cx="360" cy="152" r="10"/>
<rect class="ok" x="248" y="96" width="56" height="16" rx="8"/>
<rect class="deep" x="400" y="16" width="120" height="248" rx="28"/>
<rect class="gap" x="424" y="56" width="16" height="64" rx="8"/>
<rect class="gap" x="438" y="60" width="16" height="60" rx="8" transform="rotate(38 446 120)"/>
</svg>
</div>
<div class="words">
<h1 class="name">Eduka</h1>
<p class="tag">Reforço escolar gamificado, com o Kadu ao lado do aluno.</p>
</div>
</div>
</body>
</html>
