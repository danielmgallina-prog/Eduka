<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Entregas Eduka</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Nunito+Sans:wght@400;600;700&display=swap">
<style>
/* Layout: placar geral no topo, depois um cartão por integrante com barra própria e checklist */
:root{
  --bg:#f3f6f2; --surface:#ffffff; --ink:#1d2a24; --muted:#5d6e66; --line:#dbe3dd;
  --track:#e3eae5; --accent:#2f9e5b; --accent-ink:#ffffff; --pending:#c98a1e;
  --display:"Baloo 2", "Trebuchet MS", system-ui, sans-serif;
  --body:"Nunito Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#141b17; --surface:#1c2520; --ink:#e6eee9; --muted:#9db0a6; --line:#2c3832;
  --track:#2a352f; --accent:#4cc47c; --accent-ink:#0d1a12; --pending:#e5aa47; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141b17; --surface:#1c2520; --ink:#e6eee9; --muted:#9db0a6; --line:#2c3832;
  --track:#2a352f; --accent:#4cc47c; --accent-ink:#0d1a12; --pending:#e5aa47; color-scheme:dark}

body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5}
.wrap{max-width:960px;margin:0 auto;padding-block:28px 48px;
  padding-left:max(16px, env(safe-area-inset-left,0px));padding-right:max(16px, env(safe-area-inset-right,0px));
  display:grid;gap:22px}
h1,h2{font-family:var(--display);margin:0;text-wrap:balance;line-height:1.1}
h1{font-size:2rem;font-weight:800}
.sub{color:var(--muted);margin:4px 0 0}
.meta{display:flex;flex-wrap:wrap;gap:8px 18px;color:var(--muted);font-size:.9rem;margin-top:10px}
.meta b{color:var(--ink);font-variant-numeric:tabular-nums}

.hero{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:22px;display:grid;gap:14px}
.hero-top{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
.big{font-family:var(--display);font-weight:800;font-size:3rem;line-height:1;font-variant-numeric:tabular-nums}
.big small{font-size:1rem;color:var(--muted);font-family:var(--body);font-weight:600;margin-left:6px}
.bar{height:22px;border-radius:999px;background:var(--track);overflow:hidden;position:relative}
.bar.sm{height:12px}
.fill{height:100%;border-radius:999px;background:var(--accent);width:0;transition:width .6s ease;
  box-shadow:inset 0 -4px 0 rgba(0,0,0,.12)}
@media (prefers-reduced-motion:reduce){.fill{transition:none}}

.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px;display:grid;gap:12px;align-content:start;min-width:0}
.card-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.card h2{font-size:1.35rem;font-weight:800}
.role{color:var(--muted);font-size:.85rem;text-transform:uppercase;letter-spacing:.06em;font-weight:700}
.pct{font-family:var(--display);font-weight:800;font-size:1.3rem;font-variant-numeric:tabular-nums;white-space:nowrap}
.pct span{color:var(--muted);font-size:.85rem;font-family:var(--body);font-weight:600}

ul{list-style:none;margin:0;padding:0;display:grid;gap:8px}
li{display:grid;grid-template-columns:22px 1fr;gap:10px;align-items:start}
.dot{width:22px;height:22px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;margin-top:1px}
li.done .dot{background:var(--accent);border-color:var(--accent)}
li.done .dot::after{content:"";width:6px;height:11px;border:solid var(--accent-ink);border-width:0 2.5px 2.5px 0;transform:translate(0,-1px) rotate(45deg)}
.task{min-width:0}
li.done .task-name{color:var(--muted)}
.note{display:block;font-size:.85rem;color:var(--muted);margin-top:2px;overflow-wrap:anywhere}
.tag{display:inline-block;font-size:.72rem;font-weight:700;letter-spacing:.05em;text-transform:uppercase;padding:1px 8px;border-radius:999px;margin-left:6px;vertical-align:1px}
li.done .tag{background:color-mix(in srgb,var(--accent) 16%,transparent);color:var(--accent)}
li:not(.done) .tag{background:color-mix(in srgb,var(--pending) 16%,transparent);color:var(--pending)}
.foot{color:var(--muted);font-size:.85rem}
</style>

<div class="wrap">
  <header>
    <h1>Entregas da equipe Eduka</h1>
    <p class="sub" style="margin-top:2px">Equipe Abençoados f.c</p>
    <p class="sub">Hackathon 2026 · Desafio 2 "Aprender no tempo certo"</p>
    <div class="meta">
      <span>Link do Drive: <b>29/10 às 20h40</b></span>
      <span>Apresentação: <b>21h</b></span>
      <span id="countdown"></span>
    </div>
  </header>

  <section class="hero" aria-label="Progresso geral">
    <div class="hero-top">
      <div class="big" id="totalPct">0%<small></small></div>
      <div class="meta" style="margin:0"><span id="totalCount"></span></div>
    </div>
    <div class="bar" role="progressbar" aria-label="Progresso geral" id="totalBar"><div class="fill"></div></div>
  </section>

  <section class="grid" id="people"></section>
  <p class="foot" id="updated"></p>
</div>

<script>

    { t:"Respostas para as perguntas da banca", ok:true, nota:"18 perguntas com resposta curta e responsável no doc 'Preparação para a banca'; falta treinar" },

function pct(a,b){ return b ? Math.round(a/b*100) : 0; }
function esc(s){ return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }

function render(){
  let total=0, feitos=0;
  const html = EQUIPE.map(p=>{
    const f = p.itens.filter(i=>i.ok).length, n = p.itens.length;
    total+=n; feitos+=f;
    const v = pct(f,n);
    return `<article class="card">
      <div class="card-head">
        <div><div class="role">${esc(p.papel)}</div><h2>${esc(p.nome)}</h2></div>
        <div class="pct">${v}% <span>${f}/${n}</span></div>
      </div>
      <div class="bar sm" role="progressbar" aria-label="Progresso de ${esc(p.nome)}" aria-valuenow="${v}" aria-valuemin="0" aria-valuemax="100"><div class="fill" data-w="${v}"></div></div>
      <ul>${p.itens.map(i=>`<li class="${i.ok?'done':''}"><span class="dot" aria-hidden="true"></span>
        <div class="task"><span class="task-name">${esc(i.t)}</span><span class="tag">${i.ok?'Entregue':'Pendente'}</span>
        ${i.nota?`<span class="note">${esc(i.nota)}</span>`:''}</div></li>`).join('')}</ul>
    </article>`;
  }).join('');
  document.getElementById('people').innerHTML = html;
  const tv = pct(feitos,total);
  document.getElementById('totalPct').innerHTML = `${tv}%<small>entregue</small>`;
  document.getElementById('totalCount').innerHTML = `<b>${feitos}</b> de <b>${total}</b> entregas`;
  const tb = document.getElementById('totalBar');
  tb.setAttribute('aria-valuenow',tv); tb.setAttribute('aria-valuemin',0); tb.setAttribute('aria-valuemax',100);
  tb.querySelector('.fill').dataset.w = tv;
  document.getElementById('updated').textContent = `Última atualização: ${ATUALIZADO}`;
  requestAnimationFrame(()=>document.querySelectorAll('.fill').forEach(el=>el.style.width=el.dataset.w+'%'));
}

function countdown(){
  const prazo = new Date('2026-10-29T20:40:00-03:00');
  const ms = prazo - new Date();
  const el = document.getElementById('countdown');
  if (ms <= 0){ el.innerHTML = '<b>Prazo encerrado</b>'; return; }
  const h = Math.floor(ms/3.6e6), m = Math.floor(ms%3.6e6/6e4);
  el.innerHTML = `Faltam <b>${h}h ${String(m).padStart(2,'0')}min</b> para o envio`;
}
render(); countdown(); setInterval(countdown, 30000);
</script>

</body></html>
