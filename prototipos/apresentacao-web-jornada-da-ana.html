<style>
/* Layout: um único mundo (mapa de jogo) com 14 ilhas ligadas por uma trilha; a câmera voa entre elas. Cada ilha usa uma tela virtual 1920x1080 reduzida. Visual único, não segue tema claro/escuro. */
:root{
  --violet:#6C3EF4; --violet-2:#8F6BF7; --violet-deep:#4F27D6; --lilac:#EEE8FE; --lilac-2:#B9A6F9;
  --ink:#1B1530; --muted:#5B5672; --line:#E6E3F0; --paper:#F7F6FB; --white:#FFFFFF;
  --orange:#FF8A1F; --orange-soft:#FFB98A; --orange-text:#B85400; --green:#12B886; --green-d:#087A58;
  --red:#C62A2F; --pen:#1F4FB5; --map:#ECE7FB; --map-dot:#D7CDF4;
  --f-display:'Fredoka','Trebuchet MS',Verdana,sans-serif; --f-body:'Lexend','Segoe UI',Arial,sans-serif; --f-hand:'Caveat','Comic Sans MS',cursive;
  color-scheme:light;
}
html,body{height:100%}
body{margin:0;background:var(--map);overflow:hidden;font-family:var(--f-body);color:var(--ink);-webkit-font-smoothing:antialiased}
#stage{position:absolute;left:50%;top:50%;width:1920px;height:1080px;transform-origin:50% 50%;overflow:hidden;background-color:var(--map);background-image:radial-gradient(var(--map-dot) 3px, transparent 3.5px);background-size:72px 72px}
#world{position:absolute;left:0;top:0;transform-origin:0 0;will-change:transform}
#fxc{position:absolute;inset:0;width:1920px;height:1080px;pointer-events:none}
.isl{position:absolute;width:1760px;height:980px;border-radius:64px;overflow:hidden;box-shadow:0 28px 0 rgba(60,30,160,.12),0 0 0 6px #fff;contain:layout paint}
.isl.light{background:var(--paper);color:var(--ink)}
.isl.roxo{background:#6C3EF4;color:#fff}
.isl.dark{background:radial-gradient(ellipse at 50% 0%,#3B1FA8 0%,#241A4F 55%,#120E22 100%);color:#fff}
.isl.violet{background:radial-gradient(ellipse at 70% 20%,#7D52FF 0%,#6C3EF4 45%,#5A2FE0 100%);color:#fff}
.scaler{position:absolute;left:9px;top:0;width:1920px;height:1080px;transform:scale(.9074);transform-origin:0 0}
.cover{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:40px;opacity:0;transition:opacity .35s;pointer-events:none}
.cover b{width:300px;height:300px;border-radius:50%;display:flex;align-items:center;justify-content:center;font:700 170px/1 var(--f-display);background:var(--violet);color:#fff}
.cover span{font:600 190px/1 var(--f-display);text-align:center;padding:0 60px}
.light .cover span{color:var(--ink)} .dark .cover span,.violet .cover span{color:#fff}
.dark .cover b{background:var(--orange);color:var(--ink)} .violet .cover b{background:#fff;color:var(--violet)}
#world.far .scaler{visibility:hidden} #world.far .cover{opacity:1} #world.far .lab.li{opacity:0}
.lab.li{transition:opacity .35s}
.lab{position:absolute;display:flex;align-items:center;gap:36px;white-space:nowrap}
.lab .md{width:150px;height:150px;border-radius:50%;background:var(--violet);color:#fff;display:flex;align-items:center;justify-content:center;font:700 80px/1 var(--f-display);box-shadow:0 12px 0 var(--violet-deep)}
.lab .md.done{background:var(--orange);box-shadow:0 12px 0 #C65A00}
.lab span{font:600 104px/1 var(--f-display);color:var(--ink)}
#marker{position:absolute;left:0;top:0;width:200px;height:240px;margin:-230px 0 0 -100px;will-change:transform}
#marker .b{width:180px;height:180px;margin:0 10px;border-radius:50%;background:var(--orange);border:12px solid #fff;box-sizing:border-box;display:flex;align-items:center;justify-content:center;font:700 64px/1 var(--f-display);color:#1B1530;box-shadow:0 18px 40px rgba(60,30,160,.35)}
#marker .p{width:0;height:0;margin:-6px auto 0;border-left:26px solid transparent;border-right:26px solid transparent;border-top:44px solid #fff}
#overlay{position:absolute;inset:0;pointer-events:none}
#overFx{position:absolute;inset:0;width:1920px;height:1080px;pointer-events:none}
.abs{position:absolute}
.fx{position:absolute;inset:0;pointer-events:none}
.eyebrow{position:absolute;left:128px;top:96px;font:600 24px/1 var(--f-body);letter-spacing:4px;text-transform:uppercase;color:var(--violet)}
.dark .eyebrow,.violet .eyebrow,.roxo .eyebrow{color:#FFD3A8}
.roxo .title{color:#fff} .roxo .muted{color:#E3DAFB !important} .roxo .card{color:var(--ink)} .roxo .drow>div:first-child{color:#EEE8FE !important} .roxo .bot .disp{color:#FFB3B6 !important} .roxo .he{background:#1B1530 !important} .roxo .cover span{color:#fff}
.dark .title{color:#fff} .dark .muted{color:#BDB3DC !important} .dark .card{color:var(--ink)}
.dark .drow>div:first-child{color:#D9CEFB !important} .dark .bot .disp{color:#FF8A8F !important}
.title{position:absolute;left:128px;top:136px;width:1500px;margin:0;font:600 76px/1.08 var(--f-display);letter-spacing:-1px;color:var(--ink);text-wrap:balance}
.kadu{position:absolute;right:128px;top:84px;width:96px;height:96px;object-fit:contain}
.card{background:#fff;border:2px solid var(--line);border-radius:28px;box-shadow:0 24px 48px rgba(108,62,244,.10)}
.muted{color:var(--muted)}
.disp{font-family:var(--f-display);font-weight:600}
.pill{display:inline-block;border-radius:999px;padding:10px 26px;font:600 26px/1.2 var(--f-body)}
.word,.char{display:inline-block}
.ic{display:block}
.side{position:absolute;left:128px;top:300px;width:470px;display:flex;flex-direction:column;gap:22px}
.side .eb{font:600 24px/1.2 var(--f-body);letter-spacing:4px;text-transform:uppercase;color:var(--violet)}
.side h2{margin:0;font:600 66px/1.06 var(--f-display);color:var(--ink);letter-spacing:-.5px;text-wrap:balance}
.side p{margin:0;font:400 32px/1.4 var(--f-body);color:var(--muted)}
.piece{position:absolute}
.piece svg{position:absolute;overflow:visible}
.piece .lbl{position:absolute;left:0;top:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;padding:0 48px;box-sizing:border-box}
.piece .lbl b{font-family:var(--f-display);font-weight:600;line-height:1.05}
.piece .lbl small{font:500 24px/1.2 var(--f-body)}
/* janela do professor */
.win{position:absolute;left:640px;top:150px;width:1152px;height:772px;border-radius:24px;background:#fff;box-shadow:0 50px 100px rgba(60,30,160,.25),0 0 0 2px var(--line);overflow:hidden}
.win .bar{height:52px;background:#F0EDF8;display:flex;align-items:center;gap:12px;padding:0 22px;border-bottom:2px solid var(--line)}

.win .bar span{margin-left:18px;font:500 20px/1 var(--f-body);color:var(--muted)}
.win .app{position:absolute;left:0;top:54px;right:0;bottom:0;display:flex}

.win .main{flex:1;position:relative;padding:28px 34px;box-sizing:border-box}
.scr{position:absolute;inset:0;padding:28px 34px;box-sizing:border-box}
.win h4{margin:0 0 6px;font:600 30px/1.2 var(--f-body);color:var(--ink)}
.win .sub{font:400 19px/1.3 var(--f-body);color:var(--muted)}
.stp{display:flex;gap:10px;margin:18px 0 20px}
.stp b{font:600 17px/1 var(--f-body);padding:9px 14px;border-radius:999px;background:#F0EDF8;color:var(--muted)}
.stp b.ok{background:#E7F8F1;color:var(--green-d)} .stp b.on{background:var(--violet);color:#fff}
.tb{width:100%;border-collapse:separate;border-spacing:0 8px}
.tb th{font:600 16px/1 var(--f-body);letter-spacing:1.5px;text-transform:uppercase;color:var(--muted);text-align:left;padding:0 14px}
.tb td{background:#FAF9FD;font:400 19px/1.3 var(--f-body);color:var(--ink);padding:12px 14px;border-top:2px solid var(--line);border-bottom:2px solid var(--line)}
.tb td:first-child{border-left:2px solid var(--line);border-radius:12px 0 0 12px;font-weight:600;width:44px}
.tb td:last-child{border-right:2px solid var(--line);border-radius:0 12px 12px 0;width:44px}
.hab{display:inline-flex;align-items:center;gap:10px;position:relative}
.hab .sk{position:absolute;inset:-4px -8px;border-radius:8px;background:linear-gradient(90deg,#EEE8FE 0%,#FFFFFF 50%,#EEE8FE 100%);background-size:200% 100%}
.hab em{font:600 13px/1 var(--f-body);font-style:normal;letter-spacing:1px;text-transform:uppercase;color:var(--violet);background:var(--lilac);padding:5px 8px;border-radius:6px}
.okc{width:30px;height:30px;border-radius:50%;background:var(--green);display:flex;align-items:center;justify-content:center}
.btn{display:inline-flex;align-items:center;justify-content:center;border-radius:999px;font:600 20px/1 var(--f-body);padding:16px 26px}
.gcard{border:2px solid var(--line);border-radius:18px;padding:18px 20px;display:flex;flex-direction:column;gap:12px;background:#fff}
.av{width:44px;height:44px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font:600 16px/1 var(--f-body);color:#fff;margin-right:-8px;border:3px solid #fff}
/* celular */
.phone{position:absolute;left:700px;top:96px;width:430px;height:880px;border-radius:64px;background:#1B1530;box-shadow:0 50px 90px rgba(60,30,160,.30)}
.phone .scrn{position:absolute;left:14px;top:14px;right:14px;bottom:14px;border-radius:52px;overflow:hidden;background:#F7F6FB}
.phone .notch{position:absolute;left:50%;top:22px;width:120px;height:30px;margin-left:-60px;border-radius:20px;background:#1B1530;z-index:5}
.ps{position:absolute;inset:0;display:flex;flex-direction:column}
.ph-top{background:var(--violet);color:#fff;padding:64px 28px 22px}
.ph-top b{font:600 34px/1.1 var(--f-display);display:block}
.ph-top small{font:400 18px/1.3 var(--f-body);opacity:.85}
.chips{display:flex;gap:10px;margin-top:16px}
.chips span{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.18);border-radius:999px;padding:8px 12px;font:600 17px/1 var(--f-body)}
.node{position:absolute;width:104px;height:104px;border-radius:50%;display:flex;align-items:center;justify-content:center;box-shadow:0 8px 0 rgba(0,0,0,.18)}
.nlab{position:absolute;font:600 19px/1.15 var(--f-body);color:var(--ink);width:150px}
.qbar{height:14px;border-radius:7px;background:#E6E3F0;margin:62px 24px 0;overflow:hidden}
.qbar i{display:block;height:100%;background:var(--green);border-radius:7px}
.opt{border:3px solid #E6E3F0;border-radius:20px;background:#fff;height:112px;display:flex;align-items:center;justify-content:center;font:600 46px/1 var(--f-display);color:var(--ink);box-shadow:0 6px 0 #E6E3F0}
.sheet{position:absolute;left:0;right:0;bottom:0;padding:26px 26px 30px;border-radius:30px 30px 0 0;display:flex;flex-direction:column;gap:12px}
/* hud */
#hud{position:fixed;left:0;right:0;bottom:0;height:5px;background:rgba(27,21,48,.08);z-index:20}
#hud i{display:block;height:100%;width:0;background:var(--orange);transition:width .4s ease}
#hint{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);z-index:30;background:rgba(27,21,48,.88);color:#fff;font:500 16px/1.4 var(--f-body);padding:12px 20px;border-radius:14px;white-space:nowrap;transition:opacity .6s}
#hint kbd{font:600 14px/1 var(--f-body);background:rgba(255,255,255,.16);border-radius:6px;padding:3px 7px;margin:0 2px}
#notes{position:fixed;left:16px;right:16px;bottom:16px;z-index:40;max-height:42vh;overflow:auto;background:rgba(18,14,34,.95);color:#F2EFFC;border-radius:18px;padding:18px 24px;font:400 20px/1.5 var(--f-body);box-shadow:0 20px 60px rgba(0,0,0,.5)}
#notes header{display:flex;justify-content:space-between;gap:16px;font:600 15px/1.2 var(--f-body);letter-spacing:2px;text-transform:uppercase;color:var(--orange-soft);margin-bottom:10px}
#notes .t{font-variant-numeric:tabular-nums;color:#fff}
#notes .nx{margin-top:12px;font-size:15px;color:#A9A1C6}

#world .isl{border-radius:0;box-shadow:none}
#world > svg, #world .lab, #world #marker, #world .cover{display:none}
.blk{position:absolute;width:132px;height:66px;border-radius:16px;background:var(--bt);box-shadow:0 14px 0 var(--bs);display:flex;align-items:center;justify-content:center;font:600 22px/1 var(--f-display);color:#fff;overflow:hidden}

.bopt{border:4px solid #E6E3F0;border-radius:28px;background:#fff;height:150px;display:flex;align-items:center;justify-content:center;font:600 64px/1 var(--f-display);color:#1B1530;box-shadow:0 10px 0 #E6E3F0}
.qo{border:3px solid #E6E3F0;border-radius:22px;background:#fff;height:96px;display:flex;align-items:center;justify-content:center;font:600 44px/1 var(--f-display);color:#1B1530;box-shadow:0 7px 0 #E6E3F0}

.isl.clash{background:radial-gradient(rgba(255,255,255,.10) 3px,transparent 3.5px) 0 0/72px 72px,radial-gradient(ellipse at 50% 25%,#8F6BF7 0%,#6C3EF4 45%,#4F27D6 100%);color:#fff}

#intro{position:absolute;inset:0;overflow:hidden;background:#6C3EF4;color:#fff}

</style>

function dset(root,name){ if(!root) return; (root.classList&&root.classList.contains('spr')?[root]:$$(root,'.spr')).forEach(s=>{ s.dataset.st=name; $$(s,'.fr').forEach(i=>{ i.style.opacity = i.classList.contains('f-'+name)?1:0; }); }); }
/* piscada: só nas poses de perfil */
setInterval(()=>{ document.querySelectorAll('.spr').forEach(s=>{ const st=s.dataset.st;
    if(s.dataset.lock!=='1'){ if(st==='perfil' && Math.random()<.04){ dset(s,'frente'); return; } if(st==='frente' && Math.random()<.06){ dset(s, Math.random()<.3?'perfil2':'perfil'); return; } if(st==='perfil2' && Math.random()<.08){ dset(s,'perfil'); return; } }
    if((st==='perfil'||st==='perfil2') && Math.random()<.07){ dset(s,st+'-pisca'); setTimeout(()=>{ if(s.dataset.st===st+'-pisca') dset(s,st); },140); } }); },250);


function splitWords(n){ n.innerHTML=n.textContent.trim().split(/\s+/).map(w=>`<span class="word">${w}</span>`).join(' '); return $$(n,'.word'); }
function splitChars(n){ n.innerHTML=n.textContent.split('').map(c=>c===' '?' ':`<span class="char">${c}</span>`).join(''); return $$(n,'.char'); }
function shake(el, tl, at, p=16){ tl.fromTo(el,{x:-p},{x:0,duration:.5,ease:'elastic.out(1.2,0.25)'},at); }
function countTo(node, to, tl, at, dur=1.2, suffix='', from=0){ const o={v:from}; tl.to(o,{v:to,duration:dur,ease:'power2.out',onUpdate:()=>{node.textContent=Math.round(o.v)+suffix;}},at); }

const entrySide = i => { if(i===0) return 'L'; if(geo[i-1].r!==geo[i].r) return 'T'; return geo[i].r%2===0?'L':'R'; };
const exitSide = i => { if(i===N-1) return 'R'; if(geo[i+1].r!==geo[i].r) return 'B'; return geo[i].r%2===0?'R':'L'; };

geo.forEach((g,i)=>{ anchorIdx.push(pts.length); pts.push(sidePt(g,entrySide(i),170)); pts.push(sidePt(g,entrySide(i),0)); pts.push(sidePt(g,exitSide(i),0)); pts.push(sidePt(g,exitSide(i),170)); });
const goal = [M+4*PX+IW/2, TOP+2*PY+IH/2]; const goalIdx=pts.length; pts.push([goal[0]-420, pts[pts.length-1][1]]); pts.push(goal);
const cum=[0]; for(let i=1;i<pts.length;i++){ cum.push(cum[i-1]+Math.hypot(pts[i][0]-pts[i-1][0], pts[i][1]-pts[i-1][1])); }

/* roteiro do guia por batida: pos = canto livre da ilha; a = ações [atraso, tipo, ...] */
const GUIDE={
  0:{pos:[110,600],a:[[1.6,'react','animado'],[2.5,'hop'],[3.3,'hop']]},
  1:{pos:[110,600],a:[[1.9,'react','rindo']],s:[[[.1,'react','feliz']]]},
  2:{pos:[150,110],a:[[.6,'react','pensando']],s:[[[0,'fetch','.grade','choque']],[[0,'react','pidao']],[[0,'react','nervoso']]]},
  3:{pos:[1590,50],a:[[1.0,'fetch','.n1','choque']],s:[[[0,'fetch','.c2','nervoso']],[[0,'react','sem_graca']]]},
  4:{pos:[1590,50],a:[[.8,'react','pensando']],s:[[[0,'fetch','.pFra','choque']],[[0,'fetch','.pMul','pensando'],[1.3,'react','animado']]]},
  6:{pos:[1590,50],a:[[.6,'react','feliz']],s:[[[0,'fetch','.g0','choque']],[[0,'fetch','.g1','nervoso']],[[0,'fetch','.g2','sem_graca']],[[0,'fetch','.band','apaixonado']]]},
  19:{pos:[200,420],a:[[1.5,'react','apaixonado']],s:[[[0,'dock','feliz']],[[0,'react','feliz']],[[0,'react','animado']]]}
};
function kaduHurt(){ const r=G.r; if(!r||!G.on) return; setFace(r,'choque'); const [x,y]=G.pos;
  gsap.timeline().to(gw,{x:x-80,y:y-10,duration:.12,ease:'power2.out'}).to(gw,{x,y,duration:.55,ease:'power2.inOut'});
  gsap.timeline().to(r.bw,{scaleX:1.15,scaleY:.85,duration:.08}).to(r.bw,{scaleX:1,scaleY:1,duration:.5,ease:'elastic.out(1,.35)'}); }
function kaduAttack(){ const r=G.r; if(!r||!G.on) return; setFace(r,'animado'); const [x,y]=G.pos;
  gsap.timeline().to(r.bw,{scaleX:.86,scaleY:1.12,duration:.1}).to(gw,{x:x+120,duration:.16,ease:'power2.in'},'<.05').to(gw,{x,duration:.45,ease:'power2.out'}).to(r.bw,{scaleX:1,scaleY:1,duration:.45,ease:'elastic.out(1,.4)'},'<'); }
function gKill(){ G.calls.forEach(c=>c.kill()); G.calls=[]; }
function gAt(t,fn){ G.calls.push(gsap.delayedCall(t,fn)); }
function gPlace(x,y,s=1){ G.pos=[x,y]; G.sc=s; gsap.set(gw,{x,y,scale:s}); }
function staticKadu(b,show){ const el=scalers[B[b].isl]; const k=el&&el.querySelector('.kadu'); if(k) k.style.opacity=show?'':'0'; }
function guideHide(instant){ gKill(); if(!G.on && !instant) return; G.on=false;
  if(instant){ gsap.killTweensOf(gw); gsap.set(gw,{opacity:0}); if(G.r) stopLife(G.r); return; }
  const r=G.r; const tl=gsap.timeline(); if(r){ setFace(r,'feliz'); tl.to(r.bw,{scaleY:.88,scaleX:1.08,duration:.14}); }
  tl.to(gw,{y:'-=700',x:'+=120',duration:.6,ease:'power3.in'}).to(gw,{opacity:0,duration:.15},'-=.15').add(()=>{ if(r){ stopLife(r); gsap.set(r.bw,{scaleX:1,scaleY:1}); } }); }
/* voo: a física cuida das orelhas e da inclinação; aqui só o corpo estica ao arrancar e amassa ao frear */
function flyPose(r,dur,dir){ if(!r) return; gsap.timeline().to(r.bw,{scaleX:1.1,scaleY:.9,duration:.12,ease:'power2.out'}).to(r.bw,{scaleX:.95,scaleY:1.06,duration:.22})
  .to(r.bw,{scaleX:1.06,scaleY:.95,duration:.14},'+='+Math.max(0,dur-.5)).to(r.bw,{scaleX:1,scaleY:1,duration:.6,ease:'elastic.out(1,.35)'}); }
function guideIdle(){ if(G.idle) G.idle.kill(); const loop=()=>{ if(G.on && G.r && !introOn && !qaOn){ const toContent=Math.random()<.6; if(toContent) rigLook(G.r,960+R_(-300,300),520+R_(-150,150),.7); else rigFront(G.r,.7); } G.idle=gsap.delayedCall(R_(3.5,6),loop); }; G.idle=gsap.delayedCall(4,loop); }
function guideShowAt(x,y,face,from){ const r=G.r; G.on=true; guideIdle(); gsap.killTweensOf(gw); const fromX = from==='left' ? -400 : from==='right' ? 2200 : (x<960 ? -400 : 2200);
  gPlace(fromX,y-260,1); gsap.set(gw,{opacity:1}); if(r){ startLife(r); setFace(r,face||'animado'); flyPose(r,.9,x<960?1:-1); }
  gsap.to(gw,{x,y,duration:.9,ease:'power3.out',onComplete:()=>{ G.pos=[x,y]; }}); hop(r,50); }
function guideMoveTo(x,y,dur=.8,s=1){ gsap.to(gw,{x,y,scale:s,duration:dur,ease:'power2.inOut'}); flyPose(G.r,dur,x>G.pos[0]?1:-1); G.pos=[x,y]; G.sc=s; }
function stageRect(el){ const sr=stage.getBoundingClientRect(), k=sr.width/1920, r=el.getBoundingClientRect(); return {x:(r.left-sr.left)/k,y:(r.top-sr.top)/k,w:r.width/k,h:r.height/k}; }
function guideFetch(sel,face){ const r=G.r; const t=scalers[B[cur].isl].querySelector(sel); setFace(r,face); if(!t){ hop(r,70); return; }
  rigLookEl(r,t,.35); gAt(1.35,()=>rigLookEl(r,t,.4)); gAt(2.2,()=>rigFront(r));
  const R=stageRect(t), home=[...G.pos], s=.7, w=GS*s, hh=(r?r.H:GS)*s;
  let x = R.x+R.w/2 > 960 ? R.x - w*.75 : R.x + R.w - w*.25; let y = R.y + R.h/2 - hh*.6;
  x=Math.max(20,Math.min(1900-w,x)); y=Math.max(20,Math.min(1060-hh,y));
  gsap.timeline().to(gw,{x,y,scale:s,duration:.32,ease:'power3.out'}).add(()=>{ hop(r,40); },'-=.05')
    .to(gw,{x:home[0],y:home[1],scale:1,duration:.55,ease:'power2.inOut'},'+=.75');
  flyPose(r,.32,x>home[0]?1:-1); }
function gAction(a){ const r=G.r; const [_,type,p1,p2]=a;
  if(type==='react'){ setFace(r,p1); hop(r,60); rigLook(r,960,560,.5); gAt(1.8,()=>rigFront(r)); }
  else if(type==='face'){ setFace(r,p1); }
  else if(type==='hop'){ hop(r,80); twitch(r,1); }
  else if(type==='fetch'){ guideFetch(p1,p2); }
  else if(type==='hits'){ for(let i=0;i<p1;i++) gAt(i*.55,()=>{ hop(r,45); if(i%2) twitch(r,i%4===1?1:0); }); }
  else if(type==='dock'){ setFace(r,p1); gsap.killTweensOf(gw); gsap.to(gw,{x:DOCK[0],y:DOCK[1],scale:DOCK[2],duration:1.6,ease:'power3.inOut'}); flyPose(r,1.6,1); G.pos=[DOCK[0],DOCK[1]]; G.sc=DOCK[2]; } }
/* batida nova, animada */
function guideBeat(b,flightDur){ gKill(); const cfg=GUIDE[b];
  if(!cfg){ if(G.on){ staticKadu(b,true); guideHide(false); } return; }
  staticKadu(b,false);
  if(!G.on) gAt(flightDur,()=>guideShowAt(cfg.pos[0],cfg.pos[1],'animado',cfg.from));
  else if(G.pos[0]!==cfg.pos[0]||G.pos[1]!==cfg.pos[1]) { if(flightDur>0){ setFace(G.r,'animado'); flyPose(G.r,flightDur,1); gAt(Math.max(0,flightDur-.7),()=>guideMoveTo(cfg.pos[0],cfg.pos[1],.9)); } else guideMoveTo(cfg.pos[0],cfg.pos[1],.8); }
  (cfg.a||[]).forEach(a=>gAt(flightDur+a[0],()=>gAction(a))); }
function guideStep(b,s){ const cfg=GUIDE[b]; if(!cfg||!cfg.s||!cfg.s[s]) return; cfg.s[s].forEach(a=>gAt(a[0],()=>gAction(a))); }
/* salto direto (voltar, End, Home): estado final sem animação */
function guideSet(b,k){ gKill(); const cfg=GUIDE[b]; if(!cfg){ guideHide(true); return; }
  staticKadu(b,false); G.on=true; gsap.killTweensOf(gw);
  let face='feliz'; (cfg.a||[]).forEach(a=>{ if(a[1]==='react'||a[1]==='face') face=a[2]; else if(a[1]==='fetch') face=a[3]; });
  let docked=false; for(let s=0;s<k&&cfg.s&&cfg.s[s];s++) cfg.s[s].forEach(a=>{ if(a[1]==='dock'){ docked=true; face=a[2]; } else if(a[1]==='fetch') face=a[3]; else face=a[2]||face; });
  if(docked) gPlace(DOCK[0],DOCK[1],DOCK[2]); else if(cfg.end) gPlace(cfg.end[0],cfg.end[1],1); else gPlace(cfg.pos[0],cfg.pos[1],1);
  gsap.set(gw,{opacity:1}); if(G.r){ startLife(G.r); setFace(G.r,face); } }
let PR=null, TK=null, BK=null;
function battleKadu(holder){ getKL(L=>{ if(!holder.isConnected) return; killRig(BK); BK=createRig(L,300); gsap.delayedCall(.8,()=>BK&&rigLook(BK,1550,360,.6)); BK.el.style.filter='drop-shadow(0 10px 16px rgba(60,30,160,.45))'; holder.innerHTML=''; holder.appendChild(BK.el); startLife(BK,8); setFace(BK,'animado'); BK.E.forEach(e=>{ e.dx=.28; e.dy=-.12; }); }); }
function t3Ctx(el){ const t3=$(el,'.t3'); const KH=150*((typeof KL==='object'&&KL)?KL.H/KL.W:1.33);
  const kp=i=>({x:T3[i].sx-75, y:T3[i].y-KH-T3[i].size*.08, scale:T3[i].s*1.2});
  return {t3,KH,kp,kc:i=>{ const k=kp(i); return [k.x+75,k.y+KH-KH*k.scale*.5]; },kw:$(t3,'.t3k'),cs:$$(t3,'.t3c'),orbs:$$(t3,'.t3orb'),bs:$(t3,'.t3boss'),bsS:$(t3,'.t3boss .spr'),segs:$$(t3,'.t3seg'),lbs:$$(t3,'.t3l')}; }
function ctr(elm){ const r=stageRect(elm); return [r.x+r.w/2,r.y+r.h*.45]; }
/* bola de energia: quebra um pedaço do escudo do chefão (a vida fica intacta) */
function t3Attack(tl,X,fx,i,k){ const o=X.orbs[k], [x0,y0]=X.kc(i);
  tl.add(()=>{ if(TK){ rigLookEl(TK,X.bs,.3); gsap.delayedCall(1.4,()=>TK&&rigFront(TK,.7)); } },'>').add(()=>{ if(TK){ setFace(TK,'animado'); gsap.timeline().to(TK.bw,{scaleY:1.18,scaleX:.88,duration:.1}).to(TK.bw,{scaleY:1,scaleX:1,duration:.45,ease:'elastic.out(1,.4)'}); } },'>')
    .fromTo(o,{opacity:1,x:x0,y:y0,scale:1.2},{x:T3B[0],y:T3B[1]-110,scale:.45,duration:.5,ease:'power2.in',immediateRender:false})
    .set(o,{opacity:0})
    .add(()=>{ dset(X.bsS,'golpe'); const [cx,cy]=ctr(X.segs[k]); fx.burst(cx,cy,['#7CC4FF','#D6EEFF','#fff','#4BA3F0'],26,8); const [bx,by]=ctr(X.bs); fx.burst(bx,by,['#7CC4FF','#fff','#8F6BF7'],22,9); gsap.delayedCall(.35,()=>{ if(X.bsS.dataset.st==='golpe') dset(X.bsS,'perfil2'); }); })
    .to(X.segs[k],{scale:1.35,filter:'brightness(2)',duration:.1},'<').to(X.segs[k],{scale:1,filter:'brightness(1)',opacity:.3,background:'#CFC8E3',duration:.3,ease:'power2.out'})
    .fromTo(X.bs,{x:10},{x:0,duration:.4,ease:'elastic.out(1.2,.3)',immediateRender:false},'<');
  if(k===3) tl.add(()=>{ const [cx,cy]=ctr(X.bs); fx.burst(cx,cy,['#7CC4FF','#fff','#A9DBFF'],60,14); }).fromTo(X.bs,{filter:'brightness(1.6)'},{filter:'brightness(1)',duration:.5,immediateRender:false},'<'); }
function t3Set(X,i,st){ const c=$(X.cs[i],'.coin'), sz=T3[i].size; c.classList.remove('lock','cur','done'); c.classList.add(st);
  $(c,'.t').innerHTML = st==='done'? ic('check',Math.round(sz*.4),'#fff',3.2) : ic('star',Math.round(sz*.4),'#fff',2.4);
  const l=X.lbs[i]; if(l){ l.style.color='#1B1530'; } }
function t3Unlock(tl,X,fx,i,st,pos='>'){ tl.add(()=>{ t3Set(X,i,st); const [x,y]=ctr(X.cs[i]); fx.burst(x,y,st==='done'?['#12B886','#7EE2C2','#fff']:['#8F6BF7','#B9A6F9','#fff','#FF8A1F'],26,9); },pos)
    .fromTo(X.cs[i],{scale:.7},{scale:1,duration:.5,ease:'back.out(3)',immediateRender:false},'<')
    .fromTo($(X.cs[i],'.t'),{y:-12},{y:0,duration:.6,ease:'elastic.out(1.1,.3)',immediateRender:false},'<'); }
function t3Hop(tl,X,from,to,pos='>'){ const a=X.kp(from), b=X.kp(to);
  tl.add(()=>{ if(TK){ rigLookEl(TK,X.cs[to],.3); gsap.to(TK.bw,{scaleY:.8,scaleX:1.14,duration:.18,ease:'power2.in',delay:.15}); } },pos)
    .to(X.kw,{keyframes:[{x:(a.x+b.x)/2,y:Math.min(a.y,b.y)-70,scale:(a.scale+b.scale)/2,duration:.34,ease:'power2.out'},{x:b.x,y:b.y,scale:b.scale,duration:.3,ease:'power2.in'}]},'>.2')
    .add(()=>{ if(TK) gsap.timeline().to(TK.bw,{scaleY:1.18,scaleX:.86,duration:.16}).to(TK.bw,{scaleY:1,scaleX:1,duration:.2}).to(TK.bw,{scaleY:1.1,scaleX:.92,duration:.18}); },'<')
    .add(()=>{ if(TK){ gsap.timeline().to(TK.bw,{scaleY:.72,scaleX:1.22,duration:.07}).to(TK.bw,{scaleY:1,scaleX:1,duration:.7,ease:'elastic.out(1,.32)'}); gsap.delayedCall(.5,()=>TK&&rigFront(TK,.6)); } })
    .to($(X.cs[to],'.t'),{y:10,duration:.08,yoyo:true,repeat:1},'<'); }
function trailKadu(kw){ getKL(L=>{ if(!kw.isConnected) return; killRig(TK); TK=createRig(L,150); TK.el.style.filter='drop-shadow(0 6px 10px rgba(60,30,160,.45))'; kw.innerHTML=''; kw.appendChild(TK.el); startLife(TK,6); setFace(TK,'feliz'); }); }
function phoneKadu(kw){ getKL(L=>{ if(!kw.isConnected) return; killRig(PR); PR=createRig(L,78); kw.innerHTML=''; kw.appendChild(PR.el); gsap.set(kw,{height:PR.H}); startLife(PR,5); setFace(PR,'feliz'); }); }

  for(let j=0;j<10;j++){ const d=document.createElement('i'); d.className='spark'; d.style.left=x+'px'; d.style.top=y+'px'; d.style.background=cols[j%4]; par.appendChild(d);
    const a=-Math.PI*R_(.05,.95), v=R_(50,110); gsap.fromTo(d,{scale:R_(.6,1.2)},{x:Math.cos(a)*v,y:Math.sin(a)*v,rotation:R_(-90,90),opacity:0,duration:.8,ease:'power2.out',onComplete:()=>d.remove()}); } }
{ const dot=document.createElement('div'); dot.id='rdy'; dot.style.cssText='position:absolute;right:18px;bottom:16px;width:12px;height:12px;border-radius:50%;background:#12B886;opacity:.55;z-index:50;pointer-events:none;box-shadow:0 0 0 2px rgba(255,255,255,.5)'; stage.appendChild(dot);
  let last=null; gsap.ticker.add(()=>{ const busy=!!(active&&active.isActive()) || (typeof introOn!=='undefined' && false); if(busy!==last){ last=busy; dot.style.background=busy?'#FF8A1F':'#12B886'; } }); }
window.__deck.jump=(b,k)=>jump(b,k); Object.defineProperty(window.__deck,'busy',{get:()=>!!(active&&active.isActive())});
window.__kadu={look:(x,y,d)=>rigLook(IR||G.r,x,y,d),front:d=>rigFront(IR||G.r,d),hop:n=>hop(IR||G.r,n),face:n=>setFace(IR||G.r,n),blink:d=>blink(IR||G.r,d),twitch:w=>twitch(IR||G.r,w)};
/* liga o guia ao motor da apresentação */
{ const _fw=forward; forward=function(){ const b=cur+1; if(b>=B.length) return; const prevIsl=cur>=0?B[cur].isl:-1, isl=B[b].isl;
    let fd=(isl!==prevIsl && prevIsl>=0)?(TXDUR[isl]||TXD):0;

  const _nx=next; next=function(){ const b=cur, s=step; _nx(); if(cur===b && step===s+1) guideStep(b,s); };
  const _jp=jump; jump=function(b,k){ _jp(b,k); guideSet(b,k); };

/* ---------- tela final de perguntas: igual à de espera, só com "Dúvidas?" ---------- */
let qaOn=false;

  intro.hidden=false; gsap.killTweensOf(intro);
  intro.innerHTML=`<div class="kdh" style="position:absolute;left:720px;top:190px;width:480px;height:480px"></div><div class="bubble" style="font-size:64px;padding:26px 44px;top:200px">Dúvidas?</div><div class="word">eduka</div>`;
  const holder=$(intro,'.kdh'), bub=$(intro,'.bubble');

  gsap.fromTo(bub,{scale:0,opacity:0},{scale:1,opacity:1,duration:.55,delay:1.3,ease:'back.out(2.2)'});

    introLoops.push(gsap.delayedCall(1.3,()=>{ if(qaOn&&IR){ hop(IR,40); } }));
    const nod=()=>{ if(!qaOn||!IR) return; gsap.timeline().to(IR.jp,{y:14,duration:.18,ease:'power2.out'}).to(IR.jp,{y:0,duration:.35,ease:'back.out(2)'}).to(IR.jp,{y:10,duration:.16,ease:'power2.out'}).to(IR.jp,{y:0,duration:.3,ease:'back.out(2)'}); twitch(IR,1); introLoops.push(gsap.delayedCall(gsap.utils.random(3.5,5.5),nod)); };
    introLoops.push(gsap.delayedCall(3.2,nod)); }); }
function hideQA(){ if(!qaOn) return; qaOn=false; introLoops.forEach(t=>t&&t.kill&&t.kill()); introLoops=[];
  gsap.to(intro,{clipPath:'circle(0% at 50% 40%)',duration:.6,ease:'power3.in',onComplete:()=>{ killRig(IR); IR=null; intro.hidden=true; intro.innerHTML=''; gsap.set(intro,{clipPath:'none'}); guideSet(cur,step); }}); }
const _next=next; next=function(){ if(qaOn) return; if(introOn){ leaveIntro(); return; }
  if(cur===B.length-1 && step>=B[cur].steps.length){ if(active && active.isActive()){ active.progress(1); return; } showQA(); return; } if(cur<0){ if(!t0) t0=Date.now(); hint.style.opacity=0; startCard.remove(); forward(); return; } _next(); };
const _prev=prev; prev=function(){ if(qaOn){ hideQA(); return; } if(introOn) return; if(cur<0 || (cur===0 && step===0)){ reset(); showIntro(); return; } _prev(); };
reset(); showIntro();
})();
